name: Update publications from DBLP

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}    # allows manual run from the Actions tab
  push:                    # rebuild when awards are edited
    branches: [master]
    paths: ["data/awards.toml"]

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate publications.html
        run: python scripts/build_pubs.py

      - name: Commit if changed
        run: |
          git config user.name "pubs-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet publications.html missing_preprints.md oa_cache.json dblp_cache.xml; then
            git add publications.html missing_preprints.md oa_cache.json dblp_cache.xml
            git commit -m "chore: update publications from DBLP"
            git pull --rebase
            git push
          else
            echo "No changes."
          fi
