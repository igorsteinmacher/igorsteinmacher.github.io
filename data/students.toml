# Students shown on the home page (index.html#students).
# Edit this file, then run:  python3 scripts/build_site.py
# (or just push — the GitHub Action rebuilds the pages for you).
#
# Fields:
#   name    (required)
#   school  (required)  e.g. "NAU", "USP"
#   start   (current students)  first year, e.g. 2024
#   year    (alumni)            graduation year
#   topic   (optional)  short research topic
#   now     (optional, alumni)  current position — rendered as "now <...>"
#   note    (optional)  any extra text, e.g. "on the job market"
#   url     (optional)  link for the name (personal page, LinkedIn, ...)
#   with    (optional)  co-supervisor(s); marks you as co-supervisor in the CV
#   thesis  (optional)  thesis title (CV only)
#
# [[masters]] entries (concluded M.Sc.) appear in the CV only, with the same
# fields; `year` may be a range such as "2024–2026".
#
# Order in this file = order on the page.

