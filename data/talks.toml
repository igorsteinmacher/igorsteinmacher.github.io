# Keynotes, invited talks and panels (index.html#talks and the CV).
#
# Fields:
#   year    (required)
#   event   (required)  e.g. "FOSSY 2025"
#   kind    (optional)  e.g. "Keynote", "Invited talk", "Talk", "Panelist"
#   title   (optional)  exact talk or panel title (shown in quotes)
#   topic   (optional)  what it was about, when there is no exact title
#   place   (optional)  city / country
#   url     (optional)  event page
#   slides  (optional)  link to slides
#   video   (optional)  link to recording
#
# Order in this file = order on the page (newest first).

