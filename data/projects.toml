# Funded projects (index.html#projects and the CV's Grants section).
# Edit this file, then run:  python3 scripts/build_site.py
#
# Fields:
#   title      (required)  shown in bold
#   url        (optional)  makes the title a link (e.g. the NSF award page)
#   summary    (optional)  short description after the title
#   funder     (optional)  e.g. "Alfred P. Sloan Foundation" (skip if the title says it)
#   start      (required)  year
#   end        (optional)  year; leave out while it has no end date
#   completed  (optional)  true moves it to "Completed"
#   role       (optional)  e.g. "lead PI", "co-PI"
#   amount     (optional)  e.g. "USD 498K"
#   with       (optional)  collaborators, e.g. "Marco Gerosa"
#
# Order in this file = order on the page, within Current and Completed.

