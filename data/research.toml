# Research themes on the home page (index.html#research).
#
# Fields:
#   tag     (required)  small label above the title
#   title   (required)
#   text    (required)  plain text
#   papers  (optional)  DBLP keys of representative papers; titles and links
#                       are looked up in DBLP automatically. Find a key on
#                       dblp.org (paper's "export record" menu) or in
#                       missing_preprints.md / dblp_cache.xml.

[[theme]]
