# CV-only content for scripts/build_cv.py. Everything else in the CV comes from
# the other data/ files (projects, honors, awards, students, talks, teaching)
# and from DBLP (publications), so the website and the CV stay in sync.
#
# Text fields accept a little Markdown: **bold**, *italic*, [text](url).
# Highlights can use these counters, filled in automatically:
#   {phd_alumni}  {phd_current}  {msc_alumni}  {award_venues}

highlights = [
  "Currently supervising {phd_current} Ph.D. students",
  "Successfully supervised 20+ undergraduate research students, {msc_alumni} M.Sc. and {phd_alumni} Ph.D. students (as supervisor and co-supervisor)",
  "Supervisor of Bianca Trinkenreich's PhD dissertation, winner of the 2024 ACM SIGSOFT Outstanding Dissertation Award",
  "Best Paper / Distinguished Paper Awards at {award_venues}",
  "Higher education instructor since 2005",
  "Secured more than USD 2.5M as lead PI of NSF grants",
  "Lead guest editor of the Thematic Series on Free and Open Source Software Development, SpringerOpen Journal of Internet Services and Applications (JISA)",
  "Guest editor of the IEEE Software special issue “20 Years of Open Source—Impact on Software Engineering Practice”",
  "Citation index h44 (Google Scholar)",
]

